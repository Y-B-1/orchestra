name: install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bash install.sh
        run: bash install.sh
      - name: fixture-install.test.sh
        run: SCRATCH="$RUNNER_TEMP" bash docs/orchestra/fixture-install.test.sh
